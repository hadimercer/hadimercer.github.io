# Pings the five Streamlit Community Cloud demos so visitors are less likely
# to hit the "app is asleep" screen.
#
# Notes:
# - Streamlit Cloud tracks real viewer sessions (websockets), not plain HTTP
#   requests, so these pings reduce but do not guarantee-eliminate sleep.
#   Each project page also carries a "may take ~30s to wake" caption as a fallback.
# - GitHub pauses scheduled workflows after ~60 days without repo activity;
#   a commit or a manual run from the Actions tab re-enables it.

name: Keep Streamlit demos awake

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours, off the congested top of the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping each demo app
        run: |
          urls=(
            "https://comp-benchmarking-hadimercer-ps2.streamlit.app/"
            "https://incidentopspmi-hadimercer.streamlit.app/"
            "https://meridian-hadimercer.streamlit.app/home"
            "https://cadence-hr-workflow.streamlit.app/"
            "https://lens-sentiment-engine.streamlit.app/"
          )
          for url in "${urls[@]}"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 90 "$url" || echo "000")
            echo "$url -> HTTP $code"
          done
